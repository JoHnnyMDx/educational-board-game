<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Heist Academy - Live Arena</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="loginScreen" class="modal">
        <div class="modal-content login-card">
            <p class="eyebrow">Digital Heist Academy</p>
            <h2>Autentificare Sistem</h2>
            <p class="muted">Intră în arena live, colectează XP și rezolvă provocări de informatică.</p>
            <input type="text" id="playerNameInput" placeholder="Numele tău (ex. Ion Popescu)" maxlength="24" autocomplete="off" />
            <button id="joinGameBtn" class="answer-btn primary-action">Conectare la Rețea</button>
        </div>
    </div>

    <main id="gameUI" class="app-shell" style="display: none;">
        <section class="hud glass-panel">
            <div>
                <p class="eyebrow">NeoCity Live Network</p>
                <h1>Digital Heist Academy</h1>
            </div>
            <div class="stats">
                <p>Agent: <span id="displayName">---</span></p>
                <p>Energie: <span id="playerScore">100</span> XP</p>
                <p>Nivel: <span id="playerLevel">1</span></p>
            </div>
            <button id="rollDiceBtn">Aruncă Zarul 🎲</button>
            <p id="diceResult" class="dice-result">Pregătit pentru misiune.</p>
        </section>

        <section class="arena-layout">
            <div id="gameBoard" class="board-large" aria-label="Tabla jocului"></div>
            <aside class="leaderboard glass-panel">
                <h3>Top Agenți Live</h3>
                <ul id="leaderboardList"></ul>
            </aside>
        </section>
    </main>

    <div id="challengeModal" class="modal hidden">
        <div class="modal-content challenge-card">
            <p class="eyebrow">Mission Node</p>
            <h2 id="challengeTitle">Provocare!</h2>
            <p id="challengeText">...</p>
            
            <div id="miniGameArea" class="mini-game-area" style="display:none;">
                <canvas id="miniGameCanvas" width="300" height="300"></canvas>
                <div id="bugGameContainer"></div>
                <div id="memoryGameContainer"></div>
                <p id="miniGameStats"></p>
            </div>
            
            <div id="answersContainer" class="answers"></div>
            <button id="retryBtn" class="answer-btn danger-action" style="display:none;">❌ Eșec! Reîncearcă (-10 XP)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
